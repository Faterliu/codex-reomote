plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.codexmobile.appupdater'
version = '1.0.0'

android {
  namespace 'com.codexmobile.appupdater'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
